<!DOCTYPE html>
<html>
<head>

<title>Citation Crosschecker</title>

<link rel="stylesheet" href="/static/style.css">

</head>

<body>

<h1>Citation Crosschecker</h1>

<input id="file" type="file">

<select id="style">
<option value="apa">APA</option>
<option value="ieee">IEEE</option>
<option value="vancouver">Vancouver</option>
</select>

<label>
<input type="checkbox" id="verifyOnline">
Verify Online
</label>

<button onclick="runCheck()">Run</button>

<button onclick="exportFile('excel')">Excel</button>
<button onclick="exportFile('word')">Word</button>
<button onclick="exportFile('pdf')">PDF</button>

<pre id="output"></pre>


<script>

async function runCheck(){

let file=document.getElementById("file").files[0];

let fd=new FormData();

fd.append("file",file);
fd.append("style",document.getElementById("style").value);

fd.append("verify_online",document.getElementById("verifyOnline").checked);

let res=await fetch("/check",{method:"POST",body:fd});

let data=await res.json();

document.getElementById("output").textContent=
JSON.stringify(data,null,2);

}


async function exportFile(type){

let file=document.getElementById("file").files[0];

let fd=new FormData();

fd.append("file",file);

let res=await fetch("/export/"+type,{
method:"POST",
body:fd
});

let blob=await res.blob();

let a=document.createElement("a");

a.href=URL.createObjectURL(blob);

a.download="report."+type;

a.click();

}

</script>

</body>
</html>
