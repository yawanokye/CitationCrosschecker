<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Citation Crosschecker</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="page">
    <h1>Citation Crosschecker</h1>

    <div class="card">

      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
        <input id="file" type="file" accept=".pdf,.docx" />
        <select id="style">
          <option value="apa">APA</option>
          <option value="ieee">IEEE</option>
          <option value="vancouver">Vancouver</option>
        </select>

        <button id="runBtn" class="btn primary" type="button">Run Check</button>
      </div>

      <div style="margin-top:12px;">
        <label style="display:block;margin:6px 0;">
          <input type="checkbox" id="verify_online" />
          Enable online verification
        </label>

        <label style="display:block;margin:6px 0;">
          <input type="checkbox" id="use_crossref" checked />
          Use Crossref
        </label>

        <label style="display:block;margin:6px 0;">
          <input type="checkbox" id="use_openalex" checked />
          Use OpenAlex
        </label>

        <label style="display:block;margin:6px 0;">
          Throttle (seconds)
          <input id="throttle" type="number" value="0.25" step="0.05" min="0" style="width:100px;" />
        </label>

        <label style="display:block;margin:6px 0;">
          Max verify (0 = all)
          <input id="max_verify" type="number" value="0" step="1" min="0" style="width:100px;" />
        </label>
      </div>

      <div style="display:flex;gap:10px;margin-top:12px;">
        <button id="excelBtn" class="btn" type="button">Export Excel</button>
        <button id="wordBtn" class="btn" type="button">Export Word</button>
        <button id="pdfBtn" class="btn" type="button">Export PDF</button>
      </div>

      <div id="status" class="status" style="margin-top:10px;"></div>

      <pre id="out" style="white-space:pre-wrap;margin-top:10px;background:#111;color:#0f0;padding:10px;border-radius:10px;max-height:360px;overflow:auto;"></pre>

    </div>
  </div>

<script>
  const fileEl = document.getElementById("file");
  const styleEl = document.getElementById("style");
  const outEl = document.getElementById("out");
  const statusEl = document.getElementById("status");

  const runBtn = document.getElementById("runBtn");
  const excelBtn = document.getElementById("excelBtn");
  const wordBtn = document.getElementById("wordBtn");
  const pdfBtn = document.getElementById("pdfBtn");

  function setStatus(msg){
    statusEl.textContent = msg || "";
  }

  function getFile(){
    return (fileEl.files && fileEl.files[0]) ? fileEl.files[0] : null;
  }

  async function postTo(url){
    const f = getFile();
    if(!f){
      setStatus("Choose a DOCX or PDF first.");
      return;
    }

    const fd = new FormData();
    fd.append("file", f, f.name);
    fd.append("style", styleEl.value);

    fd.append("verify_online", String(document.getElementById("verify_online").checked));
    fd.append("use_crossref", String(document.getElementById("use_crossref").checked));
    fd.append("use_openalex", String(document.getElementById("use_openalex").checked));
    fd.append("throttle", String(document.getElementById("throttle").value));
    fd.append("max_verify", String(document.getElementById("max_verify").value));

    setStatus("Uploading...");
    let res;
    try{
      res = await fetch(url, { method:"POST", body: fd });
    }catch(e){
      setStatus("Network error, server not reachable.");
      return;
    }

    if(url === "/check"){
      const data = await res.json();
      if(!res.ok){
        setStatus("Server error. See details below.");
        outEl.textContent = JSON.stringify(data, null, 2);
        return;
      }
      setStatus("Done.");
      outEl.textContent = JSON.stringify(data, null, 2);
      return;
    }

    // export
    if(!res.ok){
      const txt = await res.text();
      setStatus("Export failed.");
      outEl.textContent = txt;
      return;
    }

    const blob = await res.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = (url.includes("excel") ? "report.xlsx" : url.includes("word") ? "report.docx" : "report.pdf");
    document.body.appendChild(a);
    a.click();
    a.remove();
    setStatus("Export downloaded.");
  }

  runBtn.addEventListener("click", () => postTo("/check"));
  excelBtn.addEventListener("click", () => postTo("/export/excel"));
  wordBtn.addEventListener("click", () => postTo("/export/word"));
  pdfBtn.addEventListener("click", () => postTo("/export/pdf"));
</script>
</body>
</html>
